services:
  db:
    image: postgres:16
    container_name: algoviz-db
    environment:
      POSTGRES_USER: algoviz
      POSTGRES_PASSWORD: algoviz
      POSTGRES_DB: algoviz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoviz -d algoviz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: